name: Deploy production

# Self-hosted runner model. The runner lives ON the production VPS and is
# registered with the labels [self-hosted, nxtdrive-vps]. Because the build
# happens on the box itself, there is NO SSH / scp / rsync-over-network: the
# release is published straight onto the local filesystem.
#
# Required GitHub Actions secrets (environment: production):
#   PRODUCTION_SUPABASE_URL, PRODUCTION_SUPABASE_ANON_KEY,
#   PRODUCTION_SUPABASE_SERVICE_ROLE_KEY, PRODUCTION_SESSION_SECRET,
#   PRODUCTION_DATABASE_URL
# Optional environment secrets for deploy-integrated smoke:
#   SMOKE_TENANT_HOST, SMOKE_CUSTOM_DOMAIN_HOST
# The old SSH_* secrets are no longer used.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, migrate and deploy to production VPS
    needs: quality
    runs-on: [self-hosted, nxtdrive-vps]
    timeout-minutes: 20
    environment: production

    env:
      APP_URL: https://nxtdrive.io
      DEPLOY_BASE: /var/www/nxtdrive/production
      SERVICE: nxtdrive-production
      PORT: "5001"
      HEALTH_PATH: /api/health

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build NXTDRIVE
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ env.APP_URL }}
        run: pnpm --filter @workspace/nxtdrive run build

      - name: Apply database migrations
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm --filter @workspace/scripts run db:migrate -- --env=production

      - name: Write runtime env file
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SECRET: ${{ secrets.PRODUCTION_SESSION_SECRET }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          MOLLIE_KEY_ENCRYPTION_SECRET: ${{ secrets.MOLLIE_KEY_ENCRYPTION_SECRET }}
        run: |
          set -euo pipefail
          umask 002
          mkdir -p "$DEPLOY_BASE/shared"
          umask 027
          cat > "$DEPLOY_BASE/shared/.env" <<EOF
          NODE_ENV=production
          PORT=$PORT
          NEXT_PUBLIC_APP_URL=$APP_URL
          NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY
          SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
          SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
          SESSION_SECRET=$SESSION_SECRET
          DATABASE_URL=$DATABASE_URL
          MOLLIE_KEY_ENCRYPTION_SECRET=$MOLLIE_KEY_ENCRYPTION_SECRET
          EOF
          chmod 640 "$DEPLOY_BASE/shared/.env"

      - name: Publish release and restart service
        run: |
          set -euo pipefail
          # Group-writable so the runtime user (deployer, group nxtdrive) can
          # write .next/cache; setgid on the parent keeps the group.
          umask 002
          RELEASE_DIR="$DEPLOY_BASE/releases/$(date +%Y%m%d%H%M%S)"
          mkdir -p "$RELEASE_DIR"
          # Ship the validated build (.next is kept). node_modules is recreated
          # locally from the lockfile so symlinks resolve on this machine.
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next/cache' \
            --exclude 'attached_assets' \
            "$GITHUB_WORKSPACE"/ "$RELEASE_DIR"/
          cd "$RELEASE_DIR"
          pnpm install --frozen-lockfile --prod=false
          ln -sfn "$RELEASE_DIR" "$DEPLOY_BASE/current"
          sudo systemctl restart "$SERVICE"
          # Keep the 5 most recent releases for rollback.
          ls -1dt "$DEPLOY_BASE"/releases/*/ | tail -n +6 | xargs -r rm -rf

      - name: Health check
        run: |
          set -euo pipefail
          url="http://127.0.0.1:${PORT}${HEALTH_PATH}"
          for i in $(seq 1 30); do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' "$url" || true)"
            if [ "$code" = "200" ]; then
              echo "Health check passed: $url"
              exit 0
            fi
            echo "Attempt $i: $url returned '$code', retrying in 2s..."
            sleep 2
          done
          echo "::error::Health check FAILED after 60s for $url"
          systemctl status "$SERVICE" --no-pager -l || true
          exit 1

      - name: Deploy-integrated smoke
        env:
          SMOKE_BASE_URL: ${{ env.APP_URL }}
          SMOKE_BROWSER_MODE: off
          SMOKE_TIMEOUT_MS: "30000"
          SMOKE_TENANT_HOST: ${{ secrets.SMOKE_TENANT_HOST }}
          SMOKE_CUSTOM_DOMAIN_HOST: ${{ secrets.SMOKE_CUSTOM_DOMAIN_HOST }}
        run: pnpm --filter @workspace/scripts run smoke:production
