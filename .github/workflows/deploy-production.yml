name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate and deploy to production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      APP_URL: https://app.nxtdrive.io
      DEPLOY_BASE: /var/www/nxtdrive/production
      SERVICE: nxtdrive-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build NXTDRIVE
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ env.APP_URL }}
        run: pnpm --filter @workspace/nxtdrive run build

      - name: Apply database migrations
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm --filter @workspace/scripts run db:migrate -- --env=production

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Write runtime env file on VPS
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p $DEPLOY_BASE/shared && chmod 700 $DEPLOY_BASE/shared"
          cat > /tmp/production.env <<'ENVEOF'
          NODE_ENV=production
          PORT=5001
          NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          SUPABASE_URL=${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SECRET=${{ secrets.PRODUCTION_SESSION_SECRET }}
          DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}
          ENVEOF
          scp /tmp/production.env "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_BASE/shared/.env"
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "chmod 600 $DEPLOY_BASE/shared/.env"
          rm /tmp/production.env

      - name: Rsync release and restart service
        run: |
          RELEASE_DIR="$DEPLOY_BASE/releases/$(date +%Y%m%d%H%M%S)"
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "mkdir -p $RELEASE_DIR"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next/cache' \
            --exclude 'attached_assets' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$RELEASE_DIR/"
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash <<EOF
            set -euo pipefail
            cd $RELEASE_DIR
            pnpm install --frozen-lockfile --prod=false
            pnpm --filter @workspace/nxtdrive run build
            ln -sfn $RELEASE_DIR $DEPLOY_BASE/current
            sudo systemctl restart $SERVICE
            ls -1dt $DEPLOY_BASE/releases/* | tail -n +6 | xargs -r rm -rf
          EOF
