name: Authenticated business E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1-5"

permissions:
  contents: read

concurrency:
  group: authenticated-business-e2e-staging
  cancel-in-progress: false

jobs:
  ris-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: staging
    env:
      CI: "true"
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_BASE_URL: https://staging.nxtdrive.io
      E2E_TENANT_ID: ${{ secrets.E2E_TENANT_ID }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL }}
      E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}
      E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      E2E_ENABLE_RIS_JOURNEY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @workspace/scripts exec playwright install --with-deps chromium

      - name: Run authenticated RIS journey
        run: pnpm --filter @workspace/scripts run e2e:business-flows

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authenticated-e2e-diagnostics-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
