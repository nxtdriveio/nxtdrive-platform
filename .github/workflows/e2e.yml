name: E2E smoke

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:22557
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-secret
  SESSION_SECRET: ci-only-placeholder-with-at-least-32-characters

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @workspace/scripts exec playwright install --with-deps chromium

      - name: Build
        run: pnpm --filter @workspace/nxtdrive run build

      - name: Start application
        run: |
          pnpm --filter @workspace/nxtdrive run start > "$RUNNER_TEMP/nxtdrive-e2e.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/nxtdrive-e2e.pid"

      - name: Wait for liveness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:22557/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Application did not become live after $attempt attempts."
          cat "$RUNNER_TEMP/nxtdrive-e2e.log"
          exit 1

      - name: Browser smoke
        env:
          E2E_BASE_URL: http://127.0.0.1:22557
        run: pnpm --filter @workspace/scripts run e2e:release-smoke

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nxtdrive-e2e.log
            test-results/
          if-no-files-found: warn
          retention-days: 14
