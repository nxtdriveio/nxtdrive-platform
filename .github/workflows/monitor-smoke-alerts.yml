name: Monitor smoke and alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor-smoke-alerts
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  smoke-production:
    name: Smoke production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/scripts exec playwright install --with-deps chromium

      - name: Run production smoke
        env:
          SMOKE_BASE_URL: https://nxtdrive.io
          SMOKE_TIMEOUT_MS: "30000"
          SMOKE_STUDENT_EMAIL: ${{ secrets.SMOKE_STUDENT_EMAIL }}
          SMOKE_STUDENT_PASSWORD: ${{ secrets.SMOKE_STUDENT_PASSWORD }}
          SMOKE_INSTRUCTOR_EMAIL: ${{ secrets.SMOKE_INSTRUCTOR_EMAIL }}
          SMOKE_INSTRUCTOR_PASSWORD: ${{ secrets.SMOKE_INSTRUCTOR_PASSWORD }}
          SMOKE_TENANT_HOST: ${{ secrets.SMOKE_TENANT_HOST }}
          SMOKE_CUSTOM_DOMAIN_HOST: ${{ secrets.SMOKE_CUSTOM_DOMAIN_HOST }}
        run: pnpm --filter @workspace/scripts run smoke:production

  smoke-staging:
    name: Smoke staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/scripts exec playwright install --with-deps chromium

      - name: Run staging smoke
        env:
          SMOKE_BASE_URL: https://staging.nxtdrive.io
          SMOKE_TIMEOUT_MS: "30000"
          SMOKE_STUDENT_EMAIL: ${{ secrets.SMOKE_STUDENT_EMAIL }}
          SMOKE_STUDENT_PASSWORD: ${{ secrets.SMOKE_STUDENT_PASSWORD }}
          SMOKE_INSTRUCTOR_EMAIL: ${{ secrets.SMOKE_INSTRUCTOR_EMAIL }}
          SMOKE_INSTRUCTOR_PASSWORD: ${{ secrets.SMOKE_INSTRUCTOR_PASSWORD }}
          SMOKE_TENANT_HOST: ${{ secrets.SMOKE_TENANT_HOST }}
          SMOKE_CUSTOM_DOMAIN_HOST: ${{ secrets.SMOKE_CUSTOM_DOMAIN_HOST }}
        run: pnpm --filter @workspace/scripts run smoke:production

  manage-alert-issues:
    name: Manage smoke alert issues
    if: always()
    runs-on: ubuntu-latest
    needs:
      - smoke-production
      - smoke-staging

    steps:
      - name: Open or resolve smoke alert issues
        uses: actions/github-script@v7
        env:
          PRODUCTION_RESULT: ${{ needs.smoke-production.result }}
          STAGING_RESULT: ${{ needs.smoke-staging.result }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const now = new Date().toISOString();
            const cases = [
              {
                environment: "production",
                result: process.env.PRODUCTION_RESULT,
                title: "[ops] Production smoke monitor failing",
              },
              {
                environment: "staging",
                result: process.env.STAGING_RESULT,
                title: "[ops] Staging smoke monitor failing",
              },
            ];

            async function findOpenIssue(title) {
              const search = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue state:open in:title "${title}"`,
                per_page: 10,
              });
              return search.data.items.find((item) => item.title === title) ?? null;
            }

            for (const entry of cases) {
              const existing = await findOpenIssue(entry.title);
              const failed = entry.result !== "success";

              if (failed) {
                const body = [
                  `Automatische smoke-monitor failure voor **${entry.environment}**.`,
                  "",
                  `- Resultaat: \`${entry.result}\``,
                  `- Tijd: \`${now}\``,
                  `- Workflow run: ${runUrl}`,
                  "",
                  "De monitor-workflow draait de publieke smoke-suite tegen de live omgeving en verwacht ten minste:",
                  "- health en readiness",
                  "- PWA manifests",
                  "- hosted login shell",
                  "- student/instructor login wanneer credentials als environment secrets aanwezig zijn",
                ].join("\n");

                if (existing) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: existing.number,
                    body,
                    state: "open",
                  });
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: existing.number,
                    body: `Nieuwe smoke-monitor failure gedetecteerd op ${now}.\n\nRun: ${runUrl}`,
                  });
                } else {
                  await github.rest.issues.create({
                    owner,
                    repo,
                    title: entry.title,
                    body,
                  });
                }
                continue;
              }

              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `Smoke-monitor hersteld op ${now}.\n\nRun: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: "closed",
                });
              }
            }
