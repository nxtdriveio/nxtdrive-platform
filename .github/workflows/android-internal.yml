name: Android internal and closed testing

on:
  push:
    tags:
      - "instructor-v*-rc.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without uploading to Google Play
        required: true
        type: boolean
        default: true
      channel:
        description: Google Play test channel
        required: true
        type: choice
        default: internal
        options:
          - internal
          - closed
          - internal-and-closed
      version_name:
        description: Semantic app version for manual runs
        required: true
        type: string
        default: "1.0.0"
      version_code:
        description: Optional increasing Play version code; defaults above the reserved 1.0.0 code
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  android:
    name: Build, verify and optionally publish Android App Bundle
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: google-play-internal
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Resolve release metadata, tracks and credentials
        id: release
        env:
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION_INPUT: ${{ inputs.version_name }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          channel="${CHANNEL:-internal}"
          version="$VERSION_INPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#instructor-v}"
            version="${tag%%-rc.*}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_name must use MAJOR.MINOR.PATCH."
            exit 1
          fi

          version_code="$VERSION_CODE_INPUT"
          if [ -z "$version_code" ]; then
            # 202607291 is reserved for the first 1.0.0 candidate. Every
            # automatic run starts above it and remains unique repository-wide.
            version_code=$((202607291 + GITHUB_RUN_NUMBER))
          fi
          if ! [[ "$version_code" =~ ^[0-9]+$ ]] ||
             [ "$version_code" -lt 1 ] ||
             [ "$version_code" -gt 2100000000 ]; then
            echo "::error::version_code must be an integer from 1 through 2100000000."
            exit 1
          fi

          case "$channel" in
            internal)
              tracks="internal"
              closed_requested=false
              ;;
            closed)
              tracks="alpha"
              closed_requested=true
              ;;
            internal-and-closed)
              tracks="internal,alpha"
              closed_requested=true
              ;;
            *)
              echo "::error::Unknown release channel: $channel"
              exit 1
              ;;
          esac

          signing_ready=false
          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ]; then
            signing_ready=true
          fi

          requested_upload=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$DRY_RUN" = "false" ]; then
            requested_upload=true
          fi

          can_upload=false
          if [ "$requested_upload" = "true" ] &&
             [ "$signing_ready" = "true" ] &&
             [ -n "$PLAY_JSON" ]; then
            can_upload=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
               [ "$DRY_RUN" = "false" ]; then
            echo "::error::A real Play upload requires all signing secrets and GOOGLE_PLAY_SERVICE_ACCOUNT_JSON."
            exit 1
          fi

          {
            echo "version_name=$version"
            echo "version_code=$version_code"
            echo "release_name=NXTDRIVE Instructeur $version ($version_code)"
            echo "tracks=$tracks"
            echo "closed_requested=$closed_requested"
            echo "signing_ready=$signing_ready"
            echo "can_upload=$can_upload"
          } >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        if: steps.release.outputs.signing_ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nxtdrive-upload.jks"
          chmod 600 "$RUNNER_TEMP/nxtdrive-upload.jks"

      - name: Generate native Android brand assets
        run: pnpm --filter @workspace/nxtdrive run android:assets

      - name: Gradle unit tests and lint
        working-directory: artifacts/nxtdrive/android
        env:
          ANDROID_GIT_SHA: ${{ github.sha }}
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: |
          ./gradlew --no-daemon \
            testDebugUnitTest testStagingUnitTest testProductionUnitTest \
            lintDebug lintStaging lintProduction assembleDebugAndroidTest

      - name: Build signed production AAB
        if: steps.release.outputs.signing_ready == 'true'
        working-directory: artifacts/nxtdrive/android
        env:
          ANDROID_GIT_SHA: ${{ github.sha }}
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/nxtdrive-upload.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: ./gradlew --no-daemon bundleProduction

      - name: Build clearly-labelled staging AAB when signing is unavailable
        if: steps.release.outputs.signing_ready != 'true'
        working-directory: artifacts/nxtdrive/android
        env:
          ANDROID_GIT_SHA: ${{ github.sha }}
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: ./gradlew --no-daemon bundleStaging

      - name: Verify AAB signature, identity and checksum
        id: artifact
        run: |
          if [ "${{ steps.release.outputs.signing_ready }}" = "true" ]; then
            aab="artifacts/nxtdrive/android/app/build/outputs/bundle/production/app-production.aab"
            kind="production"
          else
            aab="artifacts/nxtdrive/android/app/build/outputs/bundle/staging/app-staging.aab"
            kind="staging-dry-run"
          fi
          test -f "$aab"
          jarsigner -verify -certs "$aab"
          legacy_assets="$(
            unzip -Z1 "$aab" |
              grep -E '(^|/)(capacitor|cordova|public/|.*\.html$)' ||
              true
          )"
          if [ -n "$legacy_assets" ]; then
            echo "::error::The Android bundle still contains legacy web assets."
            printf '%s\n' "$legacy_assets"
            exit 1
          fi
          while IFS= read -r dex_entry; do
            if unzip -p "$aab" "$dex_entry" |
              strings |
              grep -Ei 'getcapacitor|BridgeActivity|SecureStoragePlugin' >/dev/null; then
              echo "::error::The Android bundle still contains a Capacitor bridge."
              exit 1
            fi
          done < <(unzip -Z1 "$aab" | grep -E '^base/dex/classes.*\.dex$')
          fingerprint="$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          checksum="$(sha256sum "$aab" | cut -d' ' -f1)"
          {
            echo "aab=$aab"
            echo "kind=$kind"
            echo "fingerprint=$fingerprint"
            echo "checksum=$checksum"
          } >> "$GITHUB_OUTPUT"
          mkdir -p release-evidence/android
          cp "$aab" "release-evidence/android/nxtdrive-instructeur-${kind}.aab"
          printf '%s  %s\n' "$checksum" "nxtdrive-instructeur-${kind}.aab" \
            > release-evidence/android/SHA256SUMS
          printf '%s\n' "$fingerprint" > release-evidence/android/signing-fingerprint.txt
          printf 'artifact-kind=%s\ntracks=%s\n' \
            "$kind" "${{ steps.release.outputs.tracks }}" \
            > release-evidence/android/artifact-kind.txt

      - name: Validate Play metadata for internal testing
        if: steps.release.outputs.closed_requested != 'true'
        run: pnpm --filter @workspace/nxtdrive exec node scripts/validate-play-assets.mjs --metadata-only

      - name: Validate complete Play listing for closed testing
        if: steps.release.outputs.closed_requested == 'true'
        run: pnpm --filter @workspace/nxtdrive exec node scripts/validate-play-assets.mjs

      - name: Generate Android release evidence
        env:
          ANDROID_SIGNING_FINGERPRINT: ${{ steps.artifact.outputs.fingerprint }}
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          RELEASE_TEST_SUMMARY: android-gradle-lint-and-bundle-pass
          RELEASE_DEPLOYMENT_STATUS: ${{ steps.release.outputs.can_upload == 'true' && 'google-play-test-upload-requested' || 'dry-run' }}
        run: pnpm run release:evidence

      - name: Prepare localized release notes
        if: steps.release.outputs.can_upload == 'true'
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: |
          notes="artifacts/nxtdrive/android/play-store/nl-NL/release-notes/${VERSION_NAME}.txt"
          if [ ! -f "$notes" ]; then
            notes="artifacts/nxtdrive/android/play-store/nl-NL/release-notes/1.0.0.txt"
          fi
          mkdir -p "$RUNNER_TEMP/whatsnew"
          cp "$notes" "$RUNNER_TEMP/whatsnew/whatsnew-nl-NL"

      - name: Upload exact bundle to Google Play test track or tracks
        if: steps.release.outputs.can_upload == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.nxtdrive.instructeur
          releaseFiles: ${{ steps.artifact.outputs.aab }}
          tracks: ${{ steps.release.outputs.tracks }}
          releaseName: ${{ steps.release.outputs.release_name }}
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Upload exact signed production artifact
        if: steps.release.outputs.signing_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-production-aab-${{ github.sha }}
          path: release-evidence/android/
          if-no-files-found: error
          retention-days: 90

      - name: Upload dry-run artifact and evidence
        if: steps.release.outputs.signing_ready != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-staging-dry-run-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nxtdrive-upload.jks"
