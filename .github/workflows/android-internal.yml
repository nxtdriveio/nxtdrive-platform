name: Android internal release

on:
  push:
    tags:
      - "instructor-v*-rc.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without uploading to Google Play
        required: true
        type: boolean
        default: true
      track:
        description: Google Play test track
        required: true
        type: choice
        default: internal
        options:
          - internal
          - alpha

permissions:
  contents: read

concurrency:
  group: android-internal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  android:
    name: Build and verify Android App Bundle
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: google-play-internal
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Resolve release metadata and credentials
        id: release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          tag="${GITHUB_REF_NAME#instructor-v}"
          version="${tag%%-rc.*}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="0.0.0"
          fi
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ]; then
            echo "signing_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing_ready=false" >> "$GITHUB_OUTPUT"
          fi
          requested_upload=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$DRY_RUN" = "false" ]; then
            requested_upload=true
          fi
          if [ "$requested_upload" = "true" ] &&
             [ -n "$PLAY_JSON" ] &&
             [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ]; then
            echo "can_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode upload keystore
        if: steps.release.outputs.signing_ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nxtdrive-upload.jks"
          chmod 600 "$RUNNER_TEMP/nxtdrive-upload.jks"

      - name: Sync Capacitor Android
        env:
          CAPACITOR_SERVER_URL: https://nxtdrive.io/instructeur
        run: pnpm --filter @workspace/nxtdrive run android:sync

      - name: Gradle unit tests and lint
        working-directory: artifacts/nxtdrive/android
        run: |
          ./gradlew --no-daemon testDebugUnitTest testStagingUnitTest lintDebug lintStaging

      - name: Build signed production AAB
        if: steps.release.outputs.signing_ready == 'true'
        working-directory: artifacts/nxtdrive/android
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/nxtdrive-upload.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: ./gradlew --no-daemon bundleProduction

      - name: Build clearly-labelled staging AAB when signing is unavailable
        if: steps.release.outputs.signing_ready != 'true'
        working-directory: artifacts/nxtdrive/android
        env:
          ANDROID_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: ./gradlew --no-daemon bundleStaging

      - name: Verify AAB signature, identity and checksum
        id: artifact
        run: |
          if [ "${{ steps.release.outputs.signing_ready }}" = "true" ]; then
            aab="artifacts/nxtdrive/android/app/build/outputs/bundle/production/app-production.aab"
            kind="production"
          else
            aab="artifacts/nxtdrive/android/app/build/outputs/bundle/staging/app-staging.aab"
            kind="staging-dry-run"
          fi
          test -f "$aab"
          # Upload keys are normally self-signed; verify entry signatures
          # without requiring a public PKIX trust chain.
          jarsigner -verify -certs "$aab"
          fingerprint="$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          checksum="$(sha256sum "$aab" | cut -d' ' -f1)"
          {
            echo "aab=$aab"
            echo "kind=$kind"
            echo "fingerprint=$fingerprint"
            echo "checksum=$checksum"
          } >> "$GITHUB_OUTPUT"
          mkdir -p release-evidence/android
          cp "$aab" "release-evidence/android/nxtdrive-instructeur-${kind}.aab"
          printf '%s  %s\n' "$checksum" "nxtdrive-instructeur-${kind}.aab" \
            > release-evidence/android/SHA256SUMS
          printf '%s\n' "$fingerprint" > release-evidence/android/signing-fingerprint.txt
          printf 'artifact-kind=%s\n' "$kind" > release-evidence/android/artifact-kind.txt

      - name: Validate Play metadata
        run: pnpm --filter @workspace/nxtdrive exec node scripts/validate-play-assets.mjs --metadata-only

      - name: Generate Android release evidence
        env:
          ANDROID_SIGNING_FINGERPRINT: ${{ steps.artifact.outputs.fingerprint }}
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          RELEASE_TEST_SUMMARY: android-gradle-and-lint-pass
          RELEASE_DEPLOYMENT_STATUS: ${{ steps.release.outputs.can_upload == 'true' && 'internal-upload-requested' || 'dry-run' }}
        run: pnpm run release:evidence

      - name: Prepare localized release notes
        if: steps.release.outputs.can_upload == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          cp artifacts/nxtdrive/android/play-store/nl-NL/release-notes/1.0.0.txt \
            "$RUNNER_TEMP/whatsnew/whatsnew-nl-NL"

      - name: Upload to Google Play test track
        if: steps.release.outputs.can_upload == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.nxtdrive.instructeur
          releaseFiles: ${{ steps.artifact.outputs.aab }}
          track: ${{ inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Upload exact signed production artifact
        if: steps.release.outputs.signing_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-production-aab-${{ github.sha }}
          path: release-evidence/android/
          if-no-files-found: error
          retention-days: 90

      - name: Upload dry-run artifact and evidence
        if: steps.release.outputs.signing_ready != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-staging-dry-run-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nxtdrive-upload.jks"
