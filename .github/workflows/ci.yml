name: Release quality gate

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:22557
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-secret
  SESSION_SECRET: ci-only-placeholder-with-at-least-32-characters

jobs:
  quality:
    name: Install, verify, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Repository lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: App release contracts
        run: pnpm --filter @workspace/scripts run test-app-release-gate

      - name: RIS journeybot contract tests
        run: pnpm --filter @workspace/scripts run test-ris-journey-bot

      - name: Integration tests
        run: pnpm run test:integration

      - name: Migration reproducibility gate
        run: pnpm run migration:smoke

      - name: Production dependency audit
        run: pnpm run security:audit

      - name: Secret scan
        run: pnpm run security:secrets

      - name: Production build
        run: pnpm --filter @workspace/nxtdrive run build

      - name: Generate release evidence
        if: always()
        env:
          RELEASE_TEST_SUMMARY: ${{ job.status }}
        run: pnpm run release:evidence

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-quality-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
