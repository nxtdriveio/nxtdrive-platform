name: Visual regression

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:22557
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-secret
  SESSION_SECRET: ci-only-placeholder-with-at-least-32-characters

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @workspace/scripts exec playwright install --with-deps chromium

      - name: Build and start
        run: |
          pnpm --filter @workspace/nxtdrive run build
          pnpm --filter @workspace/nxtdrive run start > "$RUNNER_TEMP/nxtdrive-visual.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:22557/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Application did not become live after $attempt attempts."
          cat "$RUNNER_TEMP/nxtdrive-visual.log"
          exit 1

      - name: Compare approved baselines
        env:
          NXTDRIVE_VISUAL_BASE_URL: http://127.0.0.1:22557
        run: pnpm --filter @workspace/scripts run visual:regression

      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-differences-${{ github.sha }}
          path: scripts/.visual-regression/
          if-no-files-found: warn
          retention-days: 14
