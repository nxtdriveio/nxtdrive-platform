name: Lesson reminders cron

# Periodic scheduler for the lesson-reminder job. An external scheduler must POST
# to the job route with the shared x-cron-secret header; the route is tenant-aware
# and idempotent (notification_log dedupe key on the lesson id), so overlapping or
# repeated runs never double-send.
#
# Required secrets/vars (set per repo or environment in GitHub):
#   secrets.CRON_SECRET        - must match the CRON_SECRET env on the target app
#   vars.NXTDRIVE_STAGING_URL  - e.g. https://staging.nxtdrive.io (optional)
#   vars.NXTDRIVE_PROD_URL     - e.g. https://app.nxtdrive.io (optional)
# A target is skipped when its URL var is empty, so staging-only or prod-only
# setups work without edits.

on:
  schedule:
    # Every 15 minutes. The reminder window is tenant-configurable (default 24h),
    # so a short interval guarantees each lesson is picked up while remaining
    # idempotent.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: lesson-reminders-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: staging
            url_var: NXTDRIVE_STAGING_URL
          - name: production
            url_var: NXTDRIVE_PROD_URL
    steps:
      - name: POST lesson-reminders (${{ matrix.target.name }})
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET_URL: ${{ vars[matrix.target.url_var] }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "No URL configured for ${{ matrix.target.name }} (var ${{ matrix.target.url_var }}); skipping."
            exit 0
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set; cannot authenticate cron call." >&2
            exit 1
          fi
          endpoint="${TARGET_URL%/}/api/jobs/lesson-reminders"
          echo "POST $endpoint"
          response=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -X POST "$endpoint" \
            -H "x-cron-secret: $CRON_SECRET")
          echo "HTTP $response"
          cat /tmp/body.txt
          echo
          if [ "$response" != "200" ]; then
            echo "Cron call failed with HTTP $response" >&2
            exit 1
          fi
