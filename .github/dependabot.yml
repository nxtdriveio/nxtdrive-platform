version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      production-security:
        dependency-type: production
        update-types:
          - patch
          - minor

  - package-ecosystem: gradle
    directory: /artifacts/nxtdrive/android
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
