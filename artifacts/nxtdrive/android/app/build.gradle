apply plugin: 'com.android.application'

def envValue = { String name, String fallback ->
    def value = System.getenv(name)
    return value == null || value.trim().isEmpty() ? fallback : value.trim()
}
def uploadKeystorePath = System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH")
def uploadKeystorePassword = System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
def uploadKeyAlias = System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
def productionSigningReady = [
    uploadKeystorePath,
    uploadKeystorePassword,
    uploadKeyAlias,
    uploadKeyPassword,
].every { it != null && !it.trim().isEmpty() }

android {
    namespace = "io.nxtdrive.instructeur"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.nxtdrive.instructeur"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(envValue("ANDROID_VERSION_CODE", "1"))
        versionName envValue("ANDROID_VERSION_NAME", "1.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        production {
            if (productionSigningReady) {
                storeFile file(uploadKeystorePath)
                storePassword uploadKeystorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "NXTDRIVE Instructeur Debug"
        }
        staging {
            initWith debug
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            debuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ["debug"]
            resValue "string", "app_name", "NXTDRIVE Instructeur Staging"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        production {
            initWith release
            minifyEnabled true
            shrinkResources true
            debuggable false
            if (productionSigningReady) {
                signingConfig signingConfigs.production
            }
            matchingFallbacks = ["release"]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "NXTDRIVE Instructeur"
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors true
        // Capacitor/Cordova resolves these template resources dynamically.
        disable "UnusedResources"
    }
}

tasks.configureEach { task ->
    if (task.name in ["bundleProduction", "assembleProduction", "signProductionBundle"]) {
        task.doFirst {
            if (!productionSigningReady) {
                throw new GradleException(
                    "Production signing requires ANDROID_UPLOAD_KEYSTORE_PATH, " +
                    "ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS and " +
                    "ANDROID_UPLOAD_KEY_PASSWORD."
                )
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
