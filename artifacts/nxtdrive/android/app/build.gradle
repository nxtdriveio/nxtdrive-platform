apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def envValue = { String name, String fallback ->
    def value = System.getenv(name)
    return value == null || value.trim().isEmpty() ? fallback : value.trim()
}
def uploadKeystorePath = System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH")
def uploadKeystorePassword = System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
def uploadKeyAlias = System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
def buildGitSha = envValue("ANDROID_GIT_SHA", "local")
    .replaceAll("[^0-9A-Za-z._-]", "")
    .take(40)
if (buildGitSha.isEmpty()) {
    buildGitSha = "local"
}
def validatedApiUrl = { String name, String fallback ->
    def value = envValue(name, fallback).replaceAll('/+$', '')
    if (!(value ==~ /^https:\/\/[A-Za-z0-9.-]+(?::[0-9]+)?(?:\/.*)?$/)) {
        throw new GradleException(
            "${name} must be an https URL without query or fragment."
        )
    }
    return value.replace("\\", "\\\\").replace("\"", "\\\"")
}
def productionApiBaseUrl = validatedApiUrl(
    "NXTDRIVE_ANDROID_API_BASE_URL",
    "https://nxtdrive.io"
)
def stagingApiBaseUrl = validatedApiUrl(
    "NXTDRIVE_ANDROID_STAGING_API_BASE_URL",
    "https://staging.nxtdrive.io"
)
def productionSigningReady = [
    uploadKeystorePath,
    uploadKeystorePassword,
    uploadKeyAlias,
    uploadKeyPassword,
].every { it != null && !it.trim().isEmpty() }

android {
    namespace = "io.nxtdrive.instructeur"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.nxtdrive.instructeur"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(envValue("ANDROID_VERSION_CODE", "1"))
        versionName envValue("ANDROID_VERSION_NAME", "1.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GIT_SHA", "\"${buildGitSha}\""
        buildConfigField "String", "RELEASE_CHANNEL", "\"unknown\""
        buildConfigField "String", "API_BASE_URL", "\"${productionApiBaseUrl}\""
    }
    signingConfigs {
        production {
            if (productionSigningReady) {
                storeFile file(uploadKeystorePath)
                storePassword uploadKeystorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "NXTDRIVE Instructeur Debug"
            buildConfigField "String", "RELEASE_CHANNEL", "\"debug\""
            buildConfigField "String", "API_BASE_URL", "\"${stagingApiBaseUrl}\""
        }
        staging {
            initWith debug
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            debuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ["debug"]
            resValue "string", "app_name", "NXTDRIVE Instructeur Staging"
            buildConfigField "String", "RELEASE_CHANNEL", "\"staging\""
            buildConfigField "String", "API_BASE_URL", "\"${stagingApiBaseUrl}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        production {
            initWith release
            minifyEnabled true
            shrinkResources true
            debuggable false
            if (productionSigningReady) {
                signingConfig signingConfigs.production
            }
            matchingFallbacks = ["release"]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "NXTDRIVE Instructeur"
            buildConfigField "String", "RELEASE_CHANNEL", "\"production\""
            buildConfigField "String", "API_BASE_URL", "\"${productionApiBaseUrl}\""
        }
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    sourceSets.configureEach {
        // The full-native app intentionally has no WebView asset source set.
        assets.srcDirs = []
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors true
    }
}

tasks.configureEach { task ->
    if (task.name in ["bundleProduction", "assembleProduction", "signProductionBundle"]) {
        task.doFirst {
            if (!productionSigningReady) {
                throw new GradleException(
                    "Production signing requires ANDROID_UPLOAD_KEYSTORE_PATH, " +
                    "ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS and " +
                    "ANDROID_UPLOAD_KEY_PASSWORD."
                )
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity-compose:1.11.0"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4"
    implementation "androidx.navigation:navigation-compose:2.9.5"
    def composeBom = platform("androidx.compose:compose-bom:2025.10.01")
    implementation composeBom
    androidTestImplementation composeBom
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
    implementation platform("com.squareup.okhttp3:okhttp-bom:5.3.0")
    implementation "com.squareup.okhttp3:okhttp"

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
