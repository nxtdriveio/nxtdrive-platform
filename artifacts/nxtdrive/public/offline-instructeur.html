<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline — NXTDRIVE Instructeur</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0f172a;
        color: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at top right, #4f46e533, transparent 42%),
          #0f172a;
      }
      main {
        width: min(27rem, calc(100% - 2rem));
        padding: 2rem;
        border: 1px solid #ffffff1f;
        border-radius: 1.5rem;
        background: #ffffff0d;
        text-align: center;
        box-shadow: 0 1.5rem 4rem #0005;
      }
      .mark {
        display: grid;
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1rem;
        place-items: center;
        border-radius: 1rem;
        background: #fff;
        color: #0f172a;
        font-weight: 900;
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
      }
      p {
        margin: 0.75rem 0 0;
        color: #cbd5e1;
        font-size: 0.925rem;
        line-height: 1.6;
      }
      button {
        min-height: 2.75rem;
        margin-top: 1.25rem;
        padding: 0.65rem 1.15rem;
        border: 0;
        border-radius: 0.9rem;
        background: #fff;
        color: #0f172a;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">NXT</div>
      <h1>Geen verbinding</h1>
      <p>
        Privégegevens uit je planning worden niet onbeveiligd opgeslagen.
        Conceptlessen die expliciet offline zijn bewaard blijven beschikbaar
        zodra je terugkeert naar de app.
      </p>
      <button type="button" onclick="location.reload()">Opnieuw proberen</button>
    </main>
  </body>
</html>
